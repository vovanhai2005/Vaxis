apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vaxis
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vovanhai2005/Vaxis.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: vaxis
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
